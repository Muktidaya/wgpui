name: WGPUI verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-boundary:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public export regression checks
        run: python3 scripts/test_public_boundary.py
      - name: Check proposed public text
        env:
          PUBLIC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PUBLIC_BASE" ] && [ "$PUBLIC_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUBLIC_BASE^{commit}" 2>/dev/null; then
            python3 scripts/check-public-boundary.py --base "$PUBLIC_BASE" --check-github-links
          else
            python3 scripts/check-public-boundary.py
          fi
  workspace:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        toolchain: ['1.95.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libpango1.0-dev libcairo2-dev libharfbuzz-dev fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji libssl-dev libvulkan-dev libegl1 libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools libdbus-1-dev libasound2-dev pkg-config cmake lld
      - name: Linux Vulkan adapter preflight
        if: runner.os == 'Linux'
        run: |
          runtime_directory="$(mktemp -d "$RUNNER_TEMP/wgpui-vulkan.XXXXXX")"
          chmod 700 "$runtime_directory"
          echo "XDG_RUNTIME_DIR=$runtime_directory" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_directory" vulkaninfo --summary
      - name: Native Windows text conformance
        if: runner.os == 'Windows'
        run: cargo test --locked -p wgpui --all-features --lib platform::windows_text_system::tests -- --test-threads=1
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-features --lib --tests
      - name: Real offscreen Kit rendering
        run: cargo test --locked -p wgpui-kit --all-features --test rendering -- --test-threads=1
      - name: Isolated native macOS clipboard
        if: runner.os == 'macOS'
        run: cargo test --locked -p wgpui --all-features --lib platform::macos_clipboard::tests -- --ignored --test-threads=1
      - run: cargo test --locked -p wgpui-kit --features test-support --lib --tests
      - run: cargo check --locked -p wgpui-kit --all-features
      - run: python scripts/check-kit-consumers.py
      - name: Strict workspace lint
        if: runner.os == 'macOS'
        run: ./scripts/clippy --workspace
      - name: Performance runner contract
        if: runner.os == 'macOS'
        run: python scripts/check-perf.py
