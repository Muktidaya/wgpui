name: WGPUI Component verification
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wgpui-component
    steps:
      - uses: actions/checkout@v6
        with:
          path: wgpui-component
      - uses: actions/checkout@v6
        with:
          repository: Muktidaya/wgpui
          ref: root
          path: wgpui
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libssl-dev libvulkan-dev pkg-config cmake
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
