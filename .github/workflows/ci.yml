name: WGPUI verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public export regression checks
        run: python3 scripts/test_public_boundary.py
      - name: Check proposed public text
        env:
          PUBLIC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PUBLIC_BASE" ] && [ "$PUBLIC_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUBLIC_BASE^{commit}" 2>/dev/null; then
            python3 scripts/check-public-boundary.py --base "$PUBLIC_BASE" --check-github-links
          else
            python3 scripts/check-public-boundary.py
          fi
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          components: clippy
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libssl-dev libvulkan-dev pkg-config cmake
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace --all-features --lib --tests
      - run: cargo test --locked -p wgpui-kit --features test-support --lib --tests
      - run: cargo check --locked -p wgpui-kit --all-features
      - run: python scripts/check-kit-consumers.py
      - name: Strict workspace lint
        if: runner.os == 'macOS'
        run: ./scripts/clippy --workspace
      - name: Performance runner contract
        if: runner.os == 'macOS'
        run: python scripts/check-perf.py
