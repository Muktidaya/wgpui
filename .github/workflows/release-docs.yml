name: Documentation artifact
# Retain a manually inspectable output, without publishing a private port or
# invoking the excluded upstream WASM gallery.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: website/.vitepress/dist
          retention-days: 7
