[package]
name = "wgpui-http-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "HTTP interfaces, asynchronous bodies and download helpers for WGPUI."
repository = "https://github.com/Muktidaya/wgpui"
documentation = "https://docs.rs/wgpui-http-client"
readme = "README.md"
publish = true

[lib]
path = "src/http_client.rs"

[features]
test-support = []

[dependencies]
anyhow = "1.0.104"
async-fs = "2.2.0"
bytes = "1.12.1"
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
log = "0.4.34"
parking_lot = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
url = "2.5.8"
async-compression = { version = "0.4.51", features = ["gzip", "futures-io"] }
async-tar = "0.6.1"
derive_more = { version = "2.1.1", features = ["deref"] }
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "multipart", "rustls", "socks", "stream", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
util = { package = "gpui_util", version = "0.2.2" }

[lints]
workspace = true
