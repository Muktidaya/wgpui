[package]
name = "gpui-base-examples-wasm"
version = "0.6.1"
publish = false
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpui.workspace = true
wgpui-base = { path = "../.." }
wgpui-platform.workspace = true
console_error_panic_hook = "0.1"
console_log = "1.0"
log.workspace = true
syntect.workspace = true
tracing-wasm = "0.2"
wasm-bindgen = "=0.2.121"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest_client.workspace = true

[lints]
workspace = true

# The shared showcase is included with `#[path]`, which cargo-machete cannot
# follow when detecting its `gpui_base` and `syntect` imports.
[package.metadata.cargo-machete]
ignored = ["wgpui-base", "reqwest_client", "syntect"]
