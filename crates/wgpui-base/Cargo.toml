[package]
description = "Behavior, interaction, and infrastructure foundations for wgpui applications (Longbridge gpui-base adaptor)."
keywords = ["desktop", "gpui", "ui", "foundation"]
license = "Apache-2.0"
name = "wgpui-base"
# The showcase binary and examples are development tools that read fixtures
# from `crates/story`; they stay out of the published package and must not
# be auto-discovered (they still `use gpui_base`).
exclude = ["src/bin/", "examples/"]
autobins = false
autoexamples = false
repository = "https://github.com/Muktidaya/wgpui"
homepage = "https://github.com/Muktidaya/wgpui"
documentation = "https://docs.rs/wgpui-base"
readme = "README.md"
version = "0.8.1"
publish = true
edition.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[[bench]]
name = "motion"
harness = false

[[bench]]
name = "text_view_scroll"
harness = false

[features]
decimal = ["dep:rust_decimal"]
test-support = ["gpui/test-support"]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow.workspace = true
aho-corasick = "1.1.5"
chrono = "0.4.45"
data-url = "0.3.2"
itertools = "0.15.0"
num-traits = "0.2.19"
rust_decimal = { version = "1.43.0", optional = true }
unicode-linebreak = "0.1.5"
futures = "0.3.34"
gpui.workspace = true
gpui_macros.workspace = true
instant.workspace = true
lsp-types.workspace = true
markdown = { version = "1.0.0", features = ["serde"] }
html5ever = "0.40.1"
ropey.workspace = true
regex = "1.13.1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
sum-tree.workspace = true
tracing.workspace = true
unicode-segmentation = "1.13.3"
web-time = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol.workspace = true


[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibility", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings"] }

[dev-dependencies]
criterion = "0.8.2"
gpui_platform = { workspace = true, features = ["bench-support"] }
gpui = { workspace = true, features = ["test-support", "bench-support"] }
indoc = "2.0.8"

[lints]
workspace = true
