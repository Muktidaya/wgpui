[package]
name = "wgpui-component-assets"
description = "Default bundled assets for wgpui-component (Longbridge gpui-component / GPUI Kit adaptor)."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/wgpui-component-assets"
homepage = "https://github.com/Muktidaya/wgpui-component"
repository = "https://github.com/Muktidaya/wgpui-component"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.6.0"

# `links` is the documented cargo mechanism for sharing build-time metadata
# across the dep graph: every dependent (regular OR build-dep) receives the
# `cargo:KEY=VALUE` lines from our build.rs as `DEP_<links>_<KEY>` env vars
# in its own build script. We use this to publish the absolute path of our
# `assets/icons` directory so `wgpui-component` can generate its `IconName`
# enum at proc-macro expansion time without a sibling-crate reference
# (which would break under `cargo vendor` / `cargo publish`). The identifier
# keeps the upstream 0.6.0 `gpui-kit-default-icons` spelling so vendored
# `build.rs` / `icon_named!("$GPUI_KIT_DEFAULT_ICONS_DIR")` keep working;
# it is not a published crate name.
links = "gpui-kit-default-icons"

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }
