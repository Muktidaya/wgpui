[package]
name = "wgpui-component-macros"
description = "Macros for wgpui-component."
version = "0.6.0"
license = "Apache-2.0"
documentation = "https://docs.rs/wgpui-component-macros"
homepage = "https://github.com/Muktidaya/wgpui-component"
repository = "https://github.com/Muktidaya/wgpui-component"
publish = true
edition.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
quote = "1.0"
syn = "2.0"

[package.metadata.cargo-machete]
ignored = ["proc-macro2", "core-text"]
