[workspace]
members = [".", "crates/wgpui-fps", "crates/wgpui-http-client", "crates/wgpui-derive", "crates/wgpui-perf", "crates/wgpui-base", "crates/wgpui-component", "crates/wgpui-kit-macros", "crates/wgpui-kit-assets", "crates/wgpui-platform", "crates/wgpui-kit", "crates/wgpui-kit-harness", "examples/kit-hello-world"]
default-members = [".", "crates/wgpui-fps", "crates/wgpui-kit"]
exclude = ["crates/wgpui-base/examples/native", "crates/wgpui-base/examples/wasm"]
resolver = "3"

[package]
name = "wgpui"
version = "0.4.0"
edition = "2024"
rust-version.workspace = true
authors = ["Muktidaya <muktidaya@icloud.com>", "Nathan Sobo <nathan@zed.dev>"]
description = "Independent wgpu + winit UI framework (community fork of GPUI / GPUI-CE 0.3.3)"
repository = "https://github.com/Muktidaya/wgpui"
documentation = "https://docs.rs/wgpui"
publish = true
license = "Apache-2.0 AND MIT AND CC-BY-SA-3.0"
homepage = "https://github.com/Muktidaya/wgpui"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]
autoexamples = false
exclude = [
    ".cargo/",
    ".github/",
    "AGENTS.md",
    "STATUS.md",
    "flake.lock",
    "flake.nix",
    "scripts/",
    "crates/",
    "docs/kit-migration-plan.md",
    "docs/kit-migration-parity.json",
]

[package.metadata.docs.rs]
features = ["inspector"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["font-kit", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "util/test-support",
    "http_client/test-support",
]
font-kit = []
inspector = ["wgpui_derive/inspector"]
leak-detection = ["backtrace"]
windows-manifest = []
profiler = ["dep:hdrhistogram"]
bench-support = ["test-support", "profiler", "dep:criterion"]

[lib]
name = "wgpui"
path = "src/wgpui.rs"
doctest = false

[dependencies]
accesskit = { version = "0.25.2", features = ["enumn"] }
accesskit_winit = "0.34.2"
anyhow = "1.0.104"
async-channel = "2.5.0"
async-task = "4.7.1"
backtrace = { version = "0.3.77", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = "0.4.45"
circular-buffer = "2.0.1"
collections = { package = "gpui_collections", version = "0.2.2" }
ctor = "1.0.13"
criterion = { version = "0.8.2", optional = true }
derive_more = { version = "2.1.1", features = ["full"] }
etagere = "0.3.0"
flume = "0.12.0"
futures = "0.3.34"
futures-concurrency = "7.7.1"
wgpui_derive = { path = "crates/wgpui-derive", version = "0.4.0", features = ["inspector"] }
http_client = { package = "wgpui-http-client", path = "crates/wgpui-http-client", version = "0.1.0" }
hdrhistogram = { version = "7.6.0", default-features = false, optional = true }
image = "0.25.10"
inventory = "0.3.25"
itertools = "0.15.0"
libc = "0.2.191"
log = { version = "0.4.34", features = ["kv_unstable_serde", "serde"] }
lyon = "1.0.19"
num_cpus = "1.17.0"
open = "5.4.5"
parking = "2.2.1"
parking_lot = "0.13.0"
pin-project = "1.1.13"
pollster = "1.0.1"
postage = { version = "0.5.0", features = ["futures-traits"] }
profiling = "1.0.18"
rand = "0.10.3"
raw-window-handle = "0.6.2"
refineable = { package = "gpui_refineable", version = "0.2.2" }
resvg = { version = "0.49.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
] }
rfd = "0.17.2"
schemars = { version = "1.2.3", features = ["indexmap2"] }
seahash = "4.1.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
slotmap = "1.1.1"
smallvec = { version = "1.16.4", features = ["union"] }
smol_str = { version = "0.3.7", features = ["serde"] }
smol = "2.0.2"
spin = "0.12.3"
stacksafe = "1.0.3"
strum = { version = "0.28.0", features = ["derive"] }
sum_tree = { package = "gpui_sum_tree", version = "0.2.2" }
taffy = "0.15.1"
thiserror = "2.0.21"
util = { package = "gpui_util", version = "0.2.2" }
util_macros = { package = "gpui_util_macros", version = "0.2.2" }
usvg = { version = "0.49.0", default-features = false }
uuid = { version = "1.29.0", features = ["v4", "v5", "v7", "serde"] }
waker-fn = "1.2.0"
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "system"] }
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "file_chooser"] }
cairo-rs = { version = "0.22.9", features = ["v1_18"] }
pango = { version = "0.22.9", features = ["v1_50"] }
pangocairo = "0.22.9"
sys-locale = "0.3.2"
tempfile = "3.27.0"
x11rb = "0.14.0"

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux", target_os = "freebsd")))'.dependencies]
arboard = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
core-text = "22.0.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSCell",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSPasteboard",
    "NSFont",
    "NSFontDescriptor",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSProcessInfo",
    "NSArray",
    "NSData",
    "NSString",
    "NSObject",
] }

[dev-dependencies]
accesskit_consumer = "0.39.2"
backtrace = "0.3.77"
collections = { package = "gpui_collections", version = "0.2.2", features = ["test-support"] }
env_logger = "0.11.11"
http_client = { package = "wgpui-http-client", path = "crates/wgpui-http-client", version = "0.1.0", features = ["test-support"] }
lyon = { version = "1.0.19", features = ["extra"] }
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
proptest = "1.12.0"
unicode-segmentation = "1.13.3"
util = { package = "gpui_util", version = "0.2.2", features = ["test-support"] }

