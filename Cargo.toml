[profile.dev]
split-debuginfo = "unpacked"
incremental = false
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16

[profile.dev.package]
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[workspace.package]
publish = false
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# Canonical WGPUI package keys; external upstream crates keep their actual names.
wgpui = { version = "0.4.0", path = "." }
wgpui_derive = { version = "0.4.0", path = "crates/wgpui-derive" }
wgpui-platform = { path = "crates/wgpui-platform", version = "0.8.1" }
wgpui-base = { path = "crates/wgpui-base", version = "0.8.1" }
wgpui-component = { path = "crates/wgpui-component", version = "0.8.1" }
wgpui-kit = { path = "crates/wgpui-kit", version = "0.8.1" }
wgpui-kit-macros = { path = "crates/wgpui-kit-macros", version = "0.8.1" }
wgpui-kit-assets = { path = "crates/wgpui-kit-assets", version = "0.8.1" }
collections = { package = "gpui_collections", version = "0.2.2" }
sum-tree = { package = "gpui_sum_tree", version = "0.2.2" }
reqwest_client = { package = "reqwest-client-gpui-unofficial", version = "1.25.3" }

anyhow = "1.0.104"
instant = { version = "0.1.13", features = ["wasm-bindgen"] }
log = "0.4.34"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.1"
raw-window-handle = "0.6.2"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
rust-i18n = "4.2.4"
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
smallvec = "1.16.4"
smol = "2.0.2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.44"
wasm-bindgen = "0.2.129"
# Use errno stub for WASM
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.62.2"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-component/pull/2149
useless_conversion = "allow"
