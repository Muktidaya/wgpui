[package]
name = "wgpui_derive"
version = "0.3.5"
edition = "2024"
rust-version = "1.94"
publish = true
license = "Apache-2.0"
description = "Proc macros for the wgpui UI framework"
repository = "https://github.com/Muktidaya/wgpui"
documentation = "https://docs.rs/wgpui_derive"
homepage = "https://github.com/Muktidaya/wgpui"
readme = "README.md"
keywords = ["gui", "macros", "proc-macro"]
categories = ["gui", "development-tools::procedural-macro-helpers"]
authors = ["Muktidaya <muktidaya@icloud.com>", "Nathan Sobo <nathan@zed.dev>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
inspector = []

[lib]
path = "src/wgpui_macros.rs"
proc-macro = true
doctest = true

[dependencies]
proc-macro-crate = "3.5"
heck = "0.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "visit-mut", "extra-traits"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }

[dev-dependencies]
wgpui = { path = "../..", package = "wgpui" }
