[package]
name = "wgpui_derive"
version = "0.3.3"
edition = "2024"
publish = true
license = "Apache-2.0"
description = "Macros used by gpui"
repository = "https://github.com/muktidaya/wgpui"
homepage = "https://gpui-ce.github.io/"
authors = ["Nathan Sobo <nathan@zed.dev>"]

[features]
inspector = []

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "visit-mut", "extra-traits"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }

[dev-dependencies]
gpui = { path = "../..", package = "wgpui" }
